version: '3.9'

services:
  # ─── Frontend (React + Nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cloudops-net

  # ─── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cloudops:cloudops@postgres:5432/cloudops
      - SECRET_KEY=${SECRET_KEY:-cloudops-secret-key-change-in-production}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app
    networks:
      - cloudops-net

  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cloudops
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: cloudops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cloudops-net

  # ─── Monitoring Agent ─────────────────────────────────────────────────────
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile.agent
    environment:
      - API_URL=http://backend:8000
      - SERVER_ID=1
      - AGENT_EMAIL=admin@cloudops.io
      - AGENT_PASSWORD=admin123
      - INTERVAL=60
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cloudops-net

volumes:
  postgres_data:

networks:
  cloudops-net:
    driver: bridge
